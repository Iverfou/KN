<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Simple KN Letters with bold colors -->
  <g transform="translate(256, 256) scale(1.5)">
    <!-- K in Blue -->
    <text x="-80" y="40" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#0055FF">K</text>

    <!-- N in Magenta -->
    <text x="20" y="40" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#E61E78">N</text>
  </g>
</svg>