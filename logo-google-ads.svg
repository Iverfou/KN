<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- K: Blue and Magenta -->
  <g transform="translate(100, 256)">
    <!-- K vertical bar - Blue -->
    <rect x="0" y="-120" width="70" height="240" fill="#0055FF" rx="8"/>

    <!-- K diagonal top - Magenta -->
    <polygon points="70,-120 170,-50 70,-20" fill="#E61E78"/>

    <!-- K diagonal bottom - Magenta -->
    <polygon points="70,20 170,90 70,120" fill="#E61E78"/>
  </g>

  <!-- N: Orange - Green - Orange -->
  <g transform="translate(280, 256)">
    <!-- N left bar - Orange -->
    <rect x="0" y="-120" width="70" height="240" fill="#FFA500" rx="8"/>

    <!-- N right bar - Orange -->
    <rect x="140" y="-120" width="70" height="240" fill="#FFA500" rx="8"/>

    <!-- N diagonal - Green -->
    <polygon points="70,-120 210,120 140,120 0,-50" fill="#00DD44"/>
  </g>
</svg>