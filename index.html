<style>
:root{
  --bg:#fff9f0;--ink:#1b1526;--muted:#5b5369;--line:#eadfcf;
  --fd:'Oswald',Impact,'Arial Narrow',sans-serif;--fb:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --c-blue:#0a7cff;--c-pink:#f0189b;--c-orange:#ff8a00;--c-green:#10b45a;--c-red:#ef3a32;--c-purple:#7a4dff;
  --kick:#c2410c;--dark:#1b1526;--green-ink:#0b7a3d;
  --card-sh:0 22px 44px -28px rgba(27,21,38,.4);
  --gut:clamp(20px,4vw,48px);
  --sec-y:clamp(64px,9vw,112px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
section[id]{scroll-margin-top:72px}
:focus-visible{outline:3px solid var(--c-orange);outline-offset:3px;border-radius:6px}
.wrap{width:min(1240px,calc(100% - 2*var(--gut)));margin-inline:auto}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{top:12px}
.topbar{position:fixed;left:0;right:0;top:0;height:6px;z-index:60;background:linear-gradient(90deg,#7a4dff,#f0189b 45%,#ff8a00)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;padding-top:6px;background:rgba(255,249,240,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);transition:box-shadow .25s}
.nav.scrolled{box-shadow:0 10px 30px -18px rgba(27,21,38,.35)}
.nav-in{height:74px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.brand img{height:46px;width:auto}
.bname{font-family:var(--fd);font-weight:700;font-size:28px;letter-spacing:.05em;line-height:1}
.links{display:flex;gap:32px;margin-left:auto;font-weight:700;font-size:16px}
.links a{opacity:.82;position:relative;padding:6px 0}
.links a:hover,.links a.on{opacity:1}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--c-orange);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.langs{display:flex;gap:2px}
.lg{width:44px;height:40px;border-radius:10px;font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--muted);transition:background .2s,color .2s}
.lg:hover{color:var(--ink)}
.lg.on{background:var(--dark);color:#fff}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);place-items:center}
.burger i,.burger i::before,.burger i::after{display:block;width:18px;height:2.5px;border-radius:3px;background:var(--ink);position:relative;transition:transform .25s,background .25s}
.burger i::before,.burger i::after{content:"";position:absolute;left:0}
.burger i::before{top:-6px}
.burger i::after{top:6px}
.nav.open .burger i{background:transparent}
.nav.open .burger i::before{transform:translateY(6px) rotate(45deg)}
.nav.open .burger i::after{transform:translateY(-6px) rotate(-45deg)}
.links .menu-cta{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 30px;border-radius:999px;font-weight:800;font-size:17px;transition:transform .2s,box-shadow .2s,background .2s,color .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.small{height:46px;padding:0 22px;font-size:15px}
.btn.wide{width:100%}
.btn-primary{background:var(--dark);color:#fff}
.btn-primary:hover{background:#000;box-shadow:0 14px 26px -14px rgba(27,21,38,.7)}
.btn.ghost{border:2px solid var(--dark);color:var(--ink)}
.btn.ghost:hover{background:var(--dark);color:#fff}
.nav-cta{height:46px;padding:0 24px;font-size:15px}

/* ---------- headings ---------- */
.kick{font-weight:800;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--kick)}
.h2{text-wrap:balance;font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:.01em}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:720px}
.head{display:flex;flex-direction:column;gap:14px}
.head.c{align-items:center;text-align:center}
.head.c .lead{max-width:780px}
.sec{position:relative;padding-block:var(--sec-y)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:clamp(28px,5vw,56px) 0 0}
.rb{position:absolute;mix-blend-mode:multiply;border-radius:6px;pointer-events:none;will-change:transform}
.rb1{left:-2%;top:6%;width:clamp(54px,8.2vw,118px);height:clamp(240px,40vw,560px);background:#1e90ff;--rot:-8deg;opacity:.92}
.rb2{left:8%;top:16%;width:clamp(44px,6.7vw,96px);height:clamp(190px,30vw,420px);background:#f0189b;--rot:30deg;opacity:.75}
.rb3{right:-2%;top:3%;width:clamp(54px,8.2vw,118px);height:clamp(260px,42vw,600px);background:#ff9a1f;--rot:7deg;opacity:.92}
.rb4{right:9%;top:18%;width:clamp(44px,6.7vw,96px);height:clamp(180px,28vw,400px);background:#14c26a;--rot:-30deg;opacity:.7}
.rb{transform:translateY(var(--py,0px)) rotate(var(--rot,0deg))}
.center{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-top:clamp(0px,2vw,20px)}
.badge{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:6px 18px;border-radius:999px;background:#fff;border:1.5px solid var(--ink);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.badge i{width:9px;height:9px;border-radius:50%;background:var(--c-green);box-shadow:0 0 0 4px rgba(16,180,90,.25);animation:pulse 1.6s ease-in-out infinite}
h1{font-family:var(--fd);font-weight:700;font-size:clamp(46px,8.6vw,100px);line-height:.98;text-transform:uppercase;letter-spacing:.005em;max-width:1160px}
h1 span{display:block}
h1 em{position:relative;z-index:0;display:inline-block;font-style:normal;padding:0 .18em}
h1 em::before{content:"";position:absolute;left:0;right:0;top:12%;bottom:4%;background:#ff9a1f;mix-blend-mode:multiply;transform:skew(-7deg);z-index:-1;animation:hl .9s .2s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes hl{from{transform:skew(-7deg) scaleX(0)}to{transform:skew(-7deg) scaleX(1)}}
.sub{font-size:clamp(17px,2vw,22px);color:var(--muted);max-width:720px}
.rot{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 12px;font-weight:800;font-size:clamp(19px,2.5vw,26px)}
.rp{color:var(--muted)}
.rbox{display:inline-grid;text-align:left}
.rw{grid-area:1/1;white-space:nowrap;opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s;color:#c2410c}
.rw.on{opacity:1;transform:none}
.cta{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:4px}
.igs{position:relative;z-index:3;margin-top:clamp(36px,6vw,64px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,24px)}
.ig{position:relative;overflow:hidden;min-height:200px;padding:24px 28px;border-radius:26px 26px 0 0;color:#fff;text-align:left;transition:transform .3s}
.ig:hover{transform:translateY(-12px)}
.g1{background:linear-gradient(135deg,#0648d6,#0a86ff)}
.g2{background:linear-gradient(135deg,#c4006e,#e8420f)}
.g3{background:linear-gradient(135deg,#00663f,#0a9a57)}
.pill{display:inline-block;padding:3px 12px;border-radius:8px;background:rgba(20,14,30,.85);font-family:var(--fd);letter-spacing:.14em;font-size:14px}
.ig h3{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(30px,3.4vw,44px);line-height:1;margin:12px 0 6px}
.ig p{font-size:15px;line-height:1.35;max-width:340px}
.ig::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}

/* ---------- marquee ---------- */
.strip{position:relative;height:76px;overflow:hidden;display:flex;align-items:center;background:var(--dark);color:#fff}
.track2{display:flex;align-items:center;width:max-content;animation:marq 34s linear infinite}
.strip:hover .track2{animation-play-state:paused}
.mi{white-space:nowrap;padding:0 26px;font-family:var(--fd);font-weight:600;text-transform:uppercase;font-size:clamp(22px,2.4vw,30px);letter-spacing:.05em}
.msep{width:12px;height:12px;background:var(--c-pink);border-radius:3px;transform:rotate(45deg);flex:0 0 auto}

/* ---------- scan ---------- */
.scan{background:#fff}
.rig{display:grid;grid-template-columns:minmax(0,1fr) 220px minmax(0,1fr);column-gap:30px;margin-top:48px}
.col{display:flex;flex-direction:column;gap:18px}
.belt{position:relative;height:150px;overflow:hidden;border-radius:20px;background:#efe3d1;border:1px solid #e0cfb6;transition:border-color .3s,box-shadow .3s}
.belt.in.sel{border-color:var(--c-orange);box-shadow:0 0 0 3px rgba(255,122,47,.3)}
.belt.out.on{border-color:var(--c-green);box-shadow:0 0 0 3px rgba(16,180,90,.22)}
.track{position:absolute;left:0;right:0;bottom:0;height:32px;background:repeating-linear-gradient(90deg,rgba(27,21,38,.14) 0 16px,rgba(27,21,38,.04) 16px 32px);animation:beltmove 1s linear infinite}
.belt.out.on .track{background:repeating-linear-gradient(90deg,rgba(16,180,90,.5) 0 16px,rgba(16,180,90,.14) 16px 32px)}
.tag{position:absolute;left:12px;top:12px;z-index:3;height:30px;padding:0 14px 0 4px;display:flex;align-items:center;gap:9px;border-radius:999px;font-size:13px;font-weight:800;background:#fff;border:1px solid #e0cfb6;transition:transform .2s}
.tag:hover{transform:translateY(-1px)}
.tn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800}
.l1 .tn{background:var(--c-blue)}
.l2 .tn{background:#d96500}
.l3 .tn{background:var(--c-pink)}
.chip{position:absolute;top:56px;left:0;z-index:2;width:172px;height:60px;padding:0 14px;display:flex;align-items:center;border-radius:12px;background:#fff;border:1px solid #e0cfb6;box-shadow:0 10px 18px -10px rgba(27,21,38,.45);font-size:13px;font-weight:800;line-height:1.15;text-transform:uppercase;animation:feed 7s linear infinite}
.d1{animation-delay:-2.33s}
.d2{animation-delay:-4.66s}
.x{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c-red);color:#fff;border:2px solid #fff}
.okrow{position:absolute;left:12px;right:12px;top:44px;display:none;gap:9px}
.belt.out.on .okrow{display:flex}
.ok{flex:1 1 0;min-width:0;height:68px;padding:0 9px;display:flex;align-items:center;gap:7px;border-radius:12px;background:#e2f8ec;color:#0a3a20;border:2px solid #10b45a;font-size:12px;font-weight:800;line-height:1.16;animation:emerge .7s cubic-bezier(.2,.8,.2,1) both}
.e1{animation-delay:.1s}.e2{animation-delay:.28s}.e3{animation-delay:.46s}
.ck{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c-green);color:#fff}
.ck.big{width:30px;height:30px}
.ck.huge{width:84px;height:84px}
.ck.huge svg{width:44px;height:44px}
.msg{position:absolute;left:0;right:0;top:56px;text-align:center;font-weight:800;font-size:15px;color:var(--c-orange);animation:pulse 1s ease-in-out infinite}
.belt.out.on .msg{display:none}
.machine{position:relative;min-height:486px;border-radius:34px;overflow:hidden;background:#1b1530;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:inset 0 0 0 4px var(--c-orange),0 0 0 8px rgba(255,122,47,.16),0 0 70px rgba(255,122,47,.32);transition:box-shadow .5s}
.machine.done{box-shadow:inset 0 0 0 4px var(--c-green),0 0 0 8px rgba(16,180,90,.16),0 0 70px rgba(16,180,90,.32)}
.band{position:absolute;left:0;right:0;top:0;height:150px;background:rgba(255,122,47,.18);border-top:2px solid var(--c-orange);border-bottom:2px solid var(--c-orange)}
.band.b2{top:168px}.band.b3{top:336px}
.machine.done .band{background:rgba(37,224,123,.2);border-color:var(--c-green)}
.beam{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,transparent,var(--c-orange) 20%,var(--c-orange) 80%,transparent);box-shadow:0 0 22px var(--c-orange);animation:sweep 2.2s ease-in-out infinite alternate}
.machine.done .beam{animation:none;opacity:0}
.mbadge{position:relative;z-index:2;width:128px;height:128px;border-radius:50%;background:#fff;border:6px solid var(--c-orange);display:grid;place-items:center;box-shadow:0 0 40px rgba(255,122,47,.5);transition:border-color .4s,box-shadow .4s}
.mbadge img{width:86px;height:auto}
.machine.done .mbadge{border-color:var(--c-green);box-shadow:0 0 40px rgba(37,224,123,.5)}
.mname{position:relative;z-index:2;font-family:var(--fd);font-weight:600;font-size:36px;letter-spacing:.06em;line-height:1}
.mtxt{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
.mstat{position:relative;z-index:2;white-space:nowrap;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.mstat.run{color:#ffb27f;background:rgba(255,122,47,.16);animation:pulse 1.1s ease-in-out infinite}
.mstat.fin{color:#06210f;background:#25e07b}
.ctrl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin-top:30px}
.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--dark);transition:transform .2s,background .2s}
.ic:hover{transform:scale(1.08);background:var(--bg)}
.dot{width:44px;height:44px;border-radius:50%;font-weight:800;border:2px solid var(--dark);transition:all .2s}
.dot.on{background:var(--c-orange);border-color:var(--c-orange);color:#1a1020}
.ctrl .btn{margin-left:14px}
.results{margin-top:34px;min-height:250px;position:relative}
.res-run,.res-done{min-height:250px;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--card-sh)}
.res-run{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-weight:700;color:var(--muted);padding:24px;text-align:center}
.res-run[hidden],.res-done[hidden]{display:none}
.pbar{width:min(420px,100%);height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--c-blue),var(--c-pink),var(--c-orange));transform-origin:left;animation:prog 3.4s ease-in-out both}
.res-done{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;align-items:center;padding:32px 44px;animation:rise .5s ease both}
.rl{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.rtitle{display:flex;align-items:center;gap:12px;font-family:var(--fd);font-weight:600;font-size:34px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.rname{font-weight:800;color:var(--green-ink)}
.rnote{font-size:14px;color:var(--muted);line-height:1.4}
.rr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ri{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:14px;background:#f4fbf7;border:1px solid #cfeadb;font-weight:700;font-size:16px;line-height:1.3}

/* ---------- services ---------- */
.svcs{background:var(--bg)}
.svcs .head{margin-bottom:clamp(32px,5vw,52px)}
.svcs .h2{font-size:clamp(38px,6.4vw,80px)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px}
.svc{position:relative;overflow:hidden;min-height:250px;padding:28px 30px;display:flex;flex-direction:column;gap:10px;border-radius:24px;background:#fff;border:1px solid var(--line);border-top:10px solid var(--cc);box-shadow:var(--card-sh);transition:transform .25s,box-shadow .25s}
.svc:hover{transform:translateY(-6px);box-shadow:0 30px 50px -26px var(--cc)}
.svc h3{font-family:var(--fd);font-weight:600;text-transform:uppercase;font-size:clamp(28px,2.6vw,34px);line-height:1.05;letter-spacing:.02em}
.svc p{font-size:16px;color:var(--muted);line-height:1.45}
.sn{font-family:var(--fd);font-size:42px;line-height:1;color:var(--cc)}
.c1{--cc:var(--c-blue)}.c2{--cc:var(--c-pink)}.c3{--cc:var(--c-orange)}.c4{--cc:var(--c-green)}.c5{--cc:var(--c-red)}.c6{--cc:var(--c-purple)}

/* ---------- approach ---------- */
.ap{background:var(--dark);color:#fff;--muted:#cbc2dc;--kick:#ffb35c}
.ap .h2{font-size:clamp(38px,6.4vw,80px);max-width:1240px}
.apgrid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:32px;margin-top:clamp(28px,4vw,44px)}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:18px;width:100%;min-height:84px;padding:0 26px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);font-weight:800;font-size:22px;text-align:left;color:#fff;transition:all .25s}
.step .sn{font-size:34px;color:var(--c-orange)}
.step:hover{transform:translateX(4px)}
.step.on{background:rgba(255,138,0,.18);border-color:var(--c-orange)}
.stpanel{position:relative;overflow:hidden;min-height:372px;padding:44px clamp(24px,4vw,52px) 84px;border-radius:26px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)}
.stbig{position:absolute;right:30px;bottom:-56px;font-family:var(--fd);font-size:250px;line-height:1;color:var(--c-orange);opacity:.12;pointer-events:none}
.stlabel{font-weight:800;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--kick)}
.stpanel h3{position:relative;font-family:var(--fd);font-weight:600;text-transform:uppercase;font-size:clamp(46px,6vw,72px);line-height:1.05;margin-top:10px}
.stpanel p{position:relative;font-size:clamp(17px,1.6vw,21px);color:var(--muted);max-width:450px;margin-top:14px}
.stbars{position:absolute;left:clamp(24px,4vw,52px);bottom:40px;display:flex;gap:8px}
.stbars i{display:block;width:clamp(40px,5vw,64px);height:8px;border-radius:8px;background:rgba(255,255,255,.2);transition:background .3s}
.stbars i.on{background:var(--c-orange)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.chips{display:flex;gap:8px;flex-wrap:wrap}

.ferr{color:#b3261e;font-weight:700;font-size:14px;min-height:0}

/* ---------- footer ---------- */
.foot{background:var(--dark);color:#fff;padding:56px 0 40px}
.foot-in{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:center;justify-content:space-between}

.fr a:hover{text-decoration:underline;text-decoration-color:var(--c-orange);text-underline-offset:4px;text-decoration-thickness:3px}

/* ---------- reveal ---------- */
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}

/* ---------- keyframes ---------- */
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes beltmove{from{background-position:0 0}to{background-position:32px 0}}
@keyframes feed{0%{left:-190px}100%{left:100%}}
@keyframes emerge{from{opacity:0;transform:translateX(-90px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes sweep{from{top:0}to{top:calc(100% - 4px)}}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const CK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const XX = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ARL = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const ARR = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const S = { lang: 'es', lane: 1, phase: 'scan', step: 0, day: 1, slot: 0, fl: 'es', auto: true, wi: 0, sent: false };
let T = COPY.es;
const get = (o, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), o);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- i18n ---------- */
function applyLang(lang, persist) {
  if (!COPY[lang]) lang = 'es';
  S.lang = lang; T = COPY[lang];
  if (persist) { store.set('kn-lang', lang); }
  document.documentElement.lang = lang;
  document.title = T.metaTitle;
  const md = $('meta[name="description"]'); if (md) md.setAttribute('content', T.metaDesc);
  $$('[data-i18n]').forEach((el) => { const v = get(T, el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
  $$('[data-ph]').forEach((el) => { el.placeholder = T[el.dataset.ph]; });
  $$('[data-aria]').forEach((el) => { el.setAttribute('aria-label', T[el.dataset.aria]); });
  $$('.lg').forEach((b) => { const on = b.dataset.lang === lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  buildRot(); buildMarq(); buildIgs(); buildScan(); buildServices(); buildApproach(); buildForm();
  syncScan(); syncApproach();
  if (S.sent) { $('#sentText').textContent = S.mailMode ? T.mailNote : T.sentText; }
  observeReveals();
}

function buildRot() {
  $('#rbox').innerHTML = T.rot.map((w, i) => '<span class="rw' + (i === S.wi % T.rot.length ? ' on' : '') + '">' + w + '</span>').join('');
}
function buildMarq() {
  const one = T.marq.map((w) => '<span class="mi">' + w + '</span><span class="msep"></span>').join('');
  $('#marq').innerHTML = one + one;
}
function buildIgs() {
  $('#igs').innerHTML = T.svc.slice(0, 3).map((x, i) => '<article class="ig g' + (i + 1) + ' rv" style="--d:' + (0.3 + i * 0.1) + 's"><span class="pill">KN DIGITAL</span><h3>' + x[0] + '</h3><p>' + x[1] + '</p></article>').join('');
}
function buildServices() {
  $('#svcGrid').innerHTML = T.svc.map((x, i) => '<article class="svc c' + (i + 1) + ' rv" style="--d:' + ((i % 3) * 0.08) + 's"><span class="sn">0' + (i + 1) + '</span><h3>' + x[0] + '</h3><p>' + x[1] + '</p></article>').join('');
  $('#prins').innerHTML = T.prin.map((x, i) => '<div class="pr c' + (i + 1) + ' rv" style="--d:' + (i * 0.08) + 's"><h3>' + x[0] + '</h3><p>' + x[1] + '</p></div>').join('');
}

/* ---------- scan ---------- */
function buildScan() {
  $('#colIn').innerHTML = T.lanes.map((ln, i) => {
    const n = i + 1;
    return '<div class="belt in l' + n + '" data-lane="' + n + '"><button class="tag" type="button" data-lane="' + n + '"><span class="tn">' + n + '</span>' + ln.name + '</button>' +
      ln.p.map((p, k) => '<div class="chip d' + k + '">' + p + '<span class="x">' + XX + '</span></div>').join('') + '<div class="track"></div></div>';
  }).join('');
  $('#colOut').innerHTML = T.lanes.map((ln, i) => {
    const n = i + 1;
    return '<div class="belt out l' + n + '" data-lane="' + n + '"><div class="okrow">' +
      ln.s.map((s, k) => '<div class="ok e' + (k + 1) + '"><span class="ck">' + CK + '</span>' + s + '</div>').join('') +
      '</div><div class="msg">' + T.scanning + '</div><div class="track"></div></div>';
  }).join('');
  $('#ctrl').innerHTML = '<button class="ic" type="button" data-nav="-1" aria-label="' + T.prev + '">' + ARL + '</button>' +
    [1, 2, 3].map((n) => '<button class="dot" type="button" data-lane="' + n + '" aria-label="' + T.beltWord + ' ' + n + '">' + n + '</button>').join('') +
    '<button class="ic" type="button" data-nav="1" aria-label="' + T.next + '">' + ARR + '</button>' +
    '<button class="btn ghost small" type="button" data-replay>' + T.replay + '</button>';
  $('#resItems').innerHTML = T.res.map((r) => '<div class="ri"><span class="ck">' + CK + '</span>' + r + '</div>').join('');
}
function syncScan() {
  const done = S.phase === 'done';
  $$('.belt.in').forEach((b) => b.classList.toggle('sel', +b.dataset.lane === S.lane));
  $$('.belt.out').forEach((b) => { b.classList.toggle('sel', +b.dataset.lane === S.lane); b.classList.toggle('on', done); });
  $$('.dot').forEach((d) => { const on = +d.dataset.lane === S.lane; d.classList.toggle('on', on); d.setAttribute('aria-pressed', on); });
  const m = $('#machine'); m.classList.toggle('done', done); m.classList.toggle('run', !done);
  const st = $('#mstat'); st.className = 'mstat ' + (done ? 'fin' : 'run'); st.textContent = done ? T.stDone : T.stScan;
  $('#resRun').hidden = done; $('#resDone').hidden = !done;
  $('#laneName').textContent = T.lanes[S.lane - 1].name;
}
let t1, t2, scanStarted = false;
function runScan() {
  clearTimeout(t1); clearTimeout(t2);
  S.phase = 'scan'; syncScan();
  t1 = setTimeout(() => { S.phase = 'done'; syncScan(); cycle(); }, 3400);
}
function cycle() {
  clearTimeout(t2);
  if (!S.auto || reduced) return;
  t2 = setTimeout(() => { S.lane = (S.lane % 3) + 1; syncScan(); cycle(); }, 5200);
}
function pickLane(n) { clearTimeout(t2); S.auto = false; S.lane = n; syncScan(); }

/* ---------- approach ---------- */
function buildApproach() {
  $('#steps').innerHTML = T.steps.map((x, i) => '<button class="step" type="button" data-step="' + i + '"><span class="sn">0' + (i + 1) + '</span>' + x[0] + '</button>').join('');
  $('#stBars').innerHTML = T.steps.map(() => '<i></i>').join('');
}
function syncApproach(anim) {
  $$('.step').forEach((b, i) => { const on = i === S.step; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $$('#stBars i').forEach((b, i) => b.classList.toggle('on', S.step >= i));
  $('#stBig').textContent = '0' + (S.step + 1);
  $('#stLabel').textContent = T.stepWord + ' ' + (S.step + 1) + ' / 4';
  $('#stTitle').textContent = T.steps[S.step][0];
  $('#stDesc').textContent = T.steps[S.step][1];
  if (anim) { const p = $('#stpanel'); p.classList.remove('swap'); void p.offsetWidth; p.classList.add('swap'); }
}

/* ---------- form ---------- */
function chips(id, items, key) {
  $('#' + id).innerHTML = items.map((t, i) => '<button class="cp' + (S[key] === (key === 'fl' ? ['es', 'fr', 'en'][i] : i) ? ' on' : '') + '" type="button" data-k="' + key + '" data-i="' + i + '">' + t + '</button>').join('');
}
function buildForm() {
  const sel = $('#f-sec'); const cur = sel.selectedIndex;
  sel.innerHTML = T.secs.map((o) => '<option>' + o + '</option>').join(''); sel.selectedIndex = Math.max(0, cur);
  chips('chDay', T.days, 'day'); chips('chSlot', T.slots, 'slot'); chips('chLang', ['ES', 'FR', 'EN'], 'fl');
}
async function submitForm(e) {
  e.preventDefault();
  const f = e.target; const err = $('#ferr'); err.textContent = '';
  if (!f.checkValidity()) { f.reportValidity(); return; }
  if ($('[name="_gotcha"]').value) return;
  const data = {
    name: f.elements.name.value.trim(), email: f.elements.email.value.trim(), company: f.elements.company.value.trim(), sector: f.elements.sector.value,
    day: T.days[S.day], slot: T.slots[S.slot], meeting_language: S.fl.toUpperCase(), message: f.elements.message.value.trim(), site_language: S.lang, source: 'kndigital.es'
  };
  if (CONFIG.formEndpoint) {
    const btn = $('#submitBtn'); btn.disabled = true; const label = btn.firstElementChild.textContent; btn.firstElementChild.textContent = T.sending;
    try {
      const r = await fetch(CONFIG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) });
      if (!r.ok) throw new Error('bad status');
      showSent(false);
    } catch (x) { err.textContent = T.sendErr; }
    btn.disabled = false; btn.firstElementChild.textContent = label;
  } else {
    const lines = [data.name + (data.company ? ' · ' + data.company : ''), data.email, '', T.fSector + ': ' + data.sector, T.fDay + ': ' + data.day + ' · ' + data.slot, T.fLang + ': ' + data.meeting_language, '', data.message];
    const href = 'mailto:' + CONFIG.email + '?subject=' + encodeURIComponent('KN Digital · ' + T.navCta + (data.company ? ' · ' + data.company : '')) + '&body=' + encodeURIComponent(lines.join('\n'));
    showSent(true); window.location.href = href;
  }
}
function showSent(mailMode) {
  S.sent = true; S.mailMode = mailMode;
  $('#rdvForm').hidden = true; $('#sent').hidden = false;
  $('#sentText').textContent = mailMode ? T.mailNote : T.sentText;
}

/* ---------- reveal on scroll ---------- */
let io;
function observeReveals() {
  if (!('IntersectionObserver' in window)) { $$('.rv').forEach((e) => e.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: .12, rootMargin: '0px 0px -6% 0px' });
  $$('.rv:not(.in)').forEach((e) => io.observe(e));
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.matches('.lg')) applyLang(t.dataset.lang, true);
  else if (t.matches('.tag, .dot')) pickLane(+t.dataset.lane);
  else if (t.matches('[data-nav]')) pickLane(((S.lane - 1 + +t.dataset.nav + 3) % 3) + 1);
  else if (t.matches('[data-replay]')) runScan();
  else if (t.matches('.step')) { S.step = +t.dataset.step; syncApproach(true); }
  else if (t.matches('.cp')) {
    const k = t.dataset.k, i = +t.dataset.i; S[k] = k === 'fl' ? ['es', 'fr', 'en'][i] : i;
    $$('.cp[data-k="' + k + '"]').forEach((b) => b.classList.toggle('on', b === t));
  }
  else if (t.id === 'again') { S.sent = false; $('#rdvForm').hidden = false; $('#sent').hidden = true; $('#rdvForm').reset(); }
  if ($('#nav').classList.contains('open') && (t.closest('#links') )) closeMenu();
});
$('#rdvForm').addEventListener('submit', submitForm);
const nav = $('#nav'), burger = $('#burger');
function closeMenu() { nav.classList.remove('open'); burger.setAttribute('aria-expanded', 'false'); }
burger.addEventListener('click', () => { const o = nav.classList.toggle('open'); burger.setAttribute('aria-expanded', o); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

/* scroll: nav shadow, ribbon parallax, active link */
const ribbons = $$('.rb');
let ticking = false;
function onScroll() {
  const y = window.scrollY;
  nav.classList.toggle('scrolled', y > 8);
  if (!reduced && y < 1200) ribbons.forEach((r) => r.style.setProperty('--py', (y * parseFloat(r.dataset.sp)) + 'px'));
  ticking = false;
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
const links = $$('#links a[href^="#"]:not(.btn)');
if ('IntersectionObserver' in window) {
  const so = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) links.forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
  ['scan', 'services', 'approche', 'rdv'].forEach((id) => so.observe(document.getElementById(id)));
  const scanIO = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting && !scanStarted) { scanStarted = true; runScan(); scanIO.disconnect(); } }), { threshold: .25 });
  scanIO.observe($('#scan'));
} else { runScan(); }

/* rotating words */
setInterval(() => { S.wi = (S.wi + 1) % T.rot.length; $$('#rbox .rw').forEach((w, i) => w.classList.toggle('on', i === S.wi)); }, 2400);

/* init */
document.documentElement.classList.add('js');
const qp = new URLSearchParams(location.search).get('lang');
applyLang(COPY[qp] ? qp : (COPY[store.get('kn-lang')] ? store.get('kn-lang') : 'es'), false);
S.fl = S.lang; buildForm();
onScroll();
</script>
</body>
</html>
